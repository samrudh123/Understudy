# Conda environment for Understudy (dev + pipeline + services).
# Create:  conda env create -f environment.yml && conda activate understudy
# Exact resolved versions are frozen in requirements.lock.txt (pip freeze) for reproducibility.
name: understudy
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - openjdk=17          # JVM for Apache Spark; sets JAVA_HOME on activate
  - cmake               # needed to build llama-cpp-python
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      # core / config
      - pydantic>=2.6
      - pyyaml>=6.0
      - numpy>=1.26,<3
      - pandas>=2.1,<3        # pyspark 3.5 is not tested against pandas 3
      - pyarrow>=15
      - requests>=2.31
      # teacher (CPU llama.cpp; built from source with cmake)
      - llama-cpp-python==0.3.36
      # data engineering + distributed
      - pyspark>=3.5,<4
      - ray[default,serve,tune]>=2.40
      # experiment tracking, versioning
      - mlflow>=2.18,<4
      - dvc>=3.50
      # ML (CPU only; this machine has no CUDA)
      - torch>=2.3
      - sentence-transformers>=3.0
      - scikit-learn>=1.4
      - onnx>=1.16
      - onnxruntime>=1.18
      # services
      - fastapi>=0.110
      - uvicorn[standard]>=0.29
      - httpx>=0.27
      - prometheus-client>=0.20
      # reporting
      - matplotlib>=3.8
      # dev
      - ruff>=0.5
      - pytest>=8.0
      - pytest-cov>=5.0
      - locust>=2.32          # load tests (tests/load)
