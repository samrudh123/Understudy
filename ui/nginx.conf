# Reverse proxy + static UI. TLS terminates here (self-signed cert generated at start-up).
server {
  listen 80;
  return 301 https://$host:8443$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /etc/nginx/certs/understudy.crt;
  ssl_certificate_key /etc/nginx/certs/understudy.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  # Re-resolve service names through Docker's DNS, so a restarted edge/console (new IP)
  # is picked up without restarting nginx. Variables in proxy_pass force per-request lookup.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $edge_upstream edge:8001;
  set $console_upstream console:8003;

  root /usr/share/nginx/html;
  index index.html;

  # Streaming answers: never buffer SSE.
  location /api/edge/ {
    rewrite ^/api/edge/(.*)$ /$1 break;
    proxy_pass http://$edge_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    client_max_body_size 16k;
  }

  location /api/console/ {
    rewrite ^/api/console/(.*)$ /$1 break;
    proxy_pass http://$console_upstream;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    client_max_body_size 256k;
  }

  # The edge's admin endpoints are not exposed through the public proxy.
  location ~ ^/api/edge/admin/ { return 403; }

  location / { try_files $uri $uri/ =404; }
}
